services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"
      EXPERIMENT_DB_PATH: /data/experiment.db
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "mcp_server.server", "--transport", "streamable-http"]
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - experiment_data:/data

volumes:
  redis_data:
  experiment_data:
